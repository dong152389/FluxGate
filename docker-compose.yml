services:
  subflow:
    image: ghcr.io/dong152389/fluxgate:latest
    container_name: subflow
    restart: unless-stopped
    ports:
      - "${PORT:-80}:${PORT:-80}"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT:-80}/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
